<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta property="og:url" content="https://www.kwang.tw/">
    <meta property="og:locale" content="zh_TW">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://www.kwang.tw/img/og/kwang_cover.png">
    <meta name="keywords" content="寬微廣告, KWang, 品牌設計, 整合行銷, 活動企劃, 視覺設計, 展場設計">
    <meta name="description" content="深耕廣告行銷領域 15 年，寬微廣告結合整合行銷策略與創意設計，從品牌定位到活動執行，為客戶打造創意與效能兼備的解決方案。">
    <meta property="og:title" content="寬微廣告｜整合行銷與品牌設計夥伴">
    <meta property="og:description" content="整合行銷、創意設計、活動規劃一條龍。寬微廣告從大局著眼，細節執行，協助品牌面對快速變動的市場。">
    <title>KWang Demo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <!-- animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <!-- 自己的樣式 -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container py-4">

        <!-- ==== Section 1 ==== -->
        <section class="content-block bg-light p-4 mb-5 wow fadeInUp lazy-bg"
                 data-wow-offset="150"
                 data-bg="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Japan_Air_Lines_%28JAL%29_Boeing_727-89_JA8315_at_Fukuoka_Airport_%28FUK%2C_RJFF%29_-_31_August_1969.jpg/960px-Japan_Air_Lines_%28JAL%29_Boeing_727-89_JA8315_at_Fukuoka_Airport_%28FUK%2C_RJFF%29_-_31_August_1969.jpg">
            <!-- 文字動畫 -->
            <h2 class="splitting mb-3" data-splitting>Awesome Works</h2>

            <!-- 前景 Lazy Load 圖片（淡入） -->
            <img
                data-src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Boeing_727-89%2C_Hapag-Lloyd_AN1138807.jpg/960px-Boeing_727-89%2C_Hapag-Lloyd_AN1138807.jpg"
                class="lazy-img img-fluid mb-4"
                alt="Lazy Foreground 1"
            >

            <!-- Swiper -->
            <div class="swiper sample-swiper mt-3">
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <img
                            data-src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Japan_Air_Lines_%28JAL%29_Boeing_727-89_JA8315_at_Fukuoka_Airport_%28FUK%2C_RJFF%29_-_31_August_1969.jpg/960px-Japan_Air_Lines_%28JAL%29_Boeing_727-89_JA8315_at_Fukuoka_Airport_%28FUK%2C_RJFF%29_-_31_August_1969.jpg"
                            class="swiper-lazy img-fluid"
                            alt="Slide 1"
                        >
                        <div class="swiper-lazy-preloader"></div>
                    </div>
                    <div class="swiper-slide">
                        <img
                            data-src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Boeing_727-89%2C_Hapag-Lloyd_AN1138807.jpg/960px-Boeing_727-89%2C_Hapag-Lloyd_AN1138807.jpg"
                            class="swiper-lazy img-fluid"
                            alt="Slide 2"
                        >
                        <div class="swiper-lazy-preloader"></div>
                    </div>
                </div>
                <!-- 分頁點點 -->
                <div class="swiper-pagination"></div>
            </div>

            <!-- 按鈕 -->
            <button class="btn-curve mt-4"><span>聯絡我們</span></button>
        </section>

        <!-- ==== Section 2 ==== -->
        <section class="content-block bg-light p-4 mb-5 wow fadeInUp lazy-bg"
                 data-wow-offset="150"
                 data-bg="https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Boeing_727-89%2C_Hapag-Lloyd_AN1138807.jpg/960px-Boeing_727-89%2C_Hapag-Lloyd_AN1138807.jpg">
            <h2 class="splitting mb-3" data-splitting>Awesome Works</h2>

            <img
                data-src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Boeing_727-89%2C_Hapag-Lloyd_AN1138807.jpg/960px-Boeing_727-89%2C_Hapag-Lloyd_AN1138807.jpg"
                class="lazy-img img-fluid mb-4"
                alt="Lazy Foreground 2"
            >

            <div class="swiper sample-swiper mt-3">
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <img
                            data-src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Japan_Air_Lines_%28JAL%29_Boeing_727-89_JA8315_at_Fukuoka_Airport_%28FUK%2C_RJFF%29_-_31_August_1969.jpg/960px-Japan_Air_Lines_%28JAL%29_Boeing_727-89_JA8315_at_Fukuoka_Airport_%28FUK%2C_RJFF%29_-_31_August_1969.jpg"
                            class="swiper-lazy img-fluid"
                            alt="Slide 1"
                        >
                        <div class="swiper-lazy-preloader"></div>
                    </div>
                    <div class="swiper-slide">
                        <img
                            data-src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Boeing_727-89%2C_Hapag-Lloyd_AN1138807.jpg/960px-Boeing_727-89%2C_Hapag-Lloyd_AN1138807.jpg"
                            class="swiper-lazy img-fluid"
                            alt="Slide 2"
                        >
                        <div class="swiper-lazy-preloader"></div>
                    </div>
                </div>
                <div class="swiper-pagination"></div>
            </div>

            <button class="btn-curve mt-4"><span>聯絡我們</span></button>
        </section>

        <!-- 你可以照上面再複製 Section 3 / Section 4 ... -->
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Splitting.js -->
    <script src="https://cdn.jsdelivr.net/npm/splitting/dist/splitting.min.js"></script>
    <!-- WOW.js -->
    <script src="https://cdn.jsdelivr.net/npm/wowjs/dist/wow.min.js"></script>

    <!-- 自己的主程式 -->
    <script src="js/main.js"></script>
</body>
</html>
